name: Typecheck NBA WNBA toggle

on:
  pull_request:
    branches:
      - main

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Full branch typecheck diagnostics
        run: |
          npx tsc --noEmit > /tmp/branch-tsc.log 2>&1 || true
          cat /tmp/branch-tsc.log

      - name: Typecheck changed feature surface
        run: |
          cat > /tmp/tsconfig-pro-league.json <<'EOF'
          {
            "extends": "\${{ github.workspace }}/tsconfig.json",
            "compilerOptions": {
              "noEmit": true
            },
            "include": [
              "\${{ github.workspace }}/app/(tabs)/comments.tsx",
              "\${{ github.workspace }}/app/live-games.tsx",
              "\${{ github.workspace }}/app/multiview.tsx",
              "\${{ github.workspace }}/app/player/[playerId].tsx",
              "\${{ github.workspace }}/app/team/[teamId].tsx",
              "\${{ github.workspace }}/components/FloatingTeamSearchButton.tsx",
              "\${{ github.workspace }}/components/InGameCommentsPanel.tsx",
              "\${{ github.workspace }}/components/TeamSearchModal.tsx",
              "\${{ github.workspace }}/components/game/PreGamePreviewScreen.tsx",
              "\${{ github.workspace }}/hooks/useLiveGame.tsx",
              "\${{ github.workspace }}/src/features/basketball/api.ts",
              "\${{ github.workspace }}/src/features/basketball/playerApi.ts",
              "\${{ github.workspace }}/src/features/basketball/teamApi.ts",
              "\${{ github.workspace }}/src/features/basketball/teamSchedule.ts",
              "\${{ github.workspace }}/src/features/nba/api.ts",
              "\${{ github.workspace }}/src/features/nba/proBasketballLeague.ts",
              "\${{ github.workspace }}/src/features/nba/teamApi.ts",
              "\${{ github.workspace }}/src/features/stockmarket/liveQuotes.ts",
              "\${{ github.workspace }}/src/features/stockmarket/stockUniverse.ts",
              "\${{ github.workspace }}/src/mode/gameModeTypes.ts",
              "\${{ github.workspace }}/src/multiview/sportSectionTabs.ts",
              "\${{ github.workspace }}/src/multiview/useMultiViewLiveGames.ts",
              "\${{ github.workspace }}/src/profile/profileSync.ts",
              "\${{ github.workspace }}/src/screens/ProfileScreen.tsx"
            ],
            "exclude": [
              "\${{ github.workspace }}/apps/api/**",
              "\${{ github.workspace }}/components/CourtOverlay.tsx",
              "\${{ github.workspace }}/components/ExternalLink.tsx"
            ]
          }
          EOF
          npx tsc -p /tmp/tsconfig-pro-league.json --noEmit

      - name: Main baseline typecheck diagnostics
        if: always()
        run: |
          git checkout --detach origin/main
          npx tsc --noEmit > /tmp/main-tsc.log 2>&1 || true
          cat /tmp/main-tsc.log
